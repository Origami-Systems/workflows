name: Build Go Server Docker Image

on:
  workflow_call:
    inputs:
      image:
        description: Container image name
        required: true
        type: string

      platforms:
        description: Target Docker platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64

      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: Dockerfile.production

      context:
        description: Docker build context
        required: false
        type: string
        default: .

      push:
        description: Push image to GHCR
        required: false
        type: boolean
        default: true

    secrets:
      CI_APP_PRIVATE_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: go-shared

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}

          tags: |
            ghcr.io/origami-systems/${{ inputs.image }}:latest
            ghcr.io/origami-systems/${{ inputs.image }}:${{ steps.version.outputs.version }}
            ghcr.io/origami-systems/${{ inputs.image }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=min

          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

          secrets: |
            github_token=${{ steps.app-token.outputs.token }}
